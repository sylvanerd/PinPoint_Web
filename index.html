<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PinPoint Captures</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="topbar">
      <h1>PinPoint Captures</h1>
      <span id="status" class="status status-pending">connecting…</span>
    </header>

    <main id="gallery" class="gallery" aria-live="polite"></main>

    <template id="card-template">
      <article class="card">
        <div class="card-image-wrap">
          <img class="card-image" alt="capture" loading="lazy" />
        </div>
        <div class="card-body">
          <p class="card-title"></p>
          <div class="card-meta">
            <span class="card-session"></span>
            <time class="card-time"></time>
          </div>
        </div>
      </article>
    </template>

    <script type="module" src="./app.js"></script>
  </body>
</html>
